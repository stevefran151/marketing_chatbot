<!DOCTYPE html>
<html>

<head>
    <title>Marketing Bot | Dark Edition</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.5.0/css/all.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>

    <style>
        :root {
            --bg-gradient: linear-gradient(to right, #24243e, #302b63, #0f0c29);
            --card-bg: rgba(0, 0, 0, 0.6);
            --bot-msg-bg: #2c3e50;
            --accent-color: #6a11cb;
        }

        /* Deep Night Mode (The Toggle State) */
        body.deep-night {
            --bg-gradient: #050505;
            --card-bg: rgba(20, 20, 20, 0.95);
            --bot-msg-bg: #1a1a1a;
            --accent-color: #444;
        }

        body,
        html {
            height: 100%;
            margin: 0;
            background: var(--bg-gradient);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            transition: background 0.5s ease;
        }

        .chat {
            margin-top: auto;
            margin-bottom: auto;
        }

        .card {
            height: 600px;
            border-radius: 20px !important;
            background-color: var(--card-bg) !important;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            transition: all 0.5s ease;
            animation: fadeInScale 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Toggle Switch Style */
        .mode-toggle {
            cursor: pointer;
            color: rgba(255, 255, 255, 0.5);
            transition: 0.3s;
            font-size: 1.2rem;
        }

        .mode-toggle:hover {
            color: white;
            transform: scale(1.1);
        }

        .mode-toggle.active {
            color: #78e08f;
            text-shadow: 0 0 10px rgba(120, 224, 143, 0.5);
        }

        .msg_card_body {
            overflow-y: auto;
        }

        .card-header {
            border-radius: 20px 20px 0 0 !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1) !important;
            background-color: transparent !important;
        }

        .card-footer {
            border-radius: 0 0 20px 20px !important;
            border-top: 1px solid rgba(255, 255, 255, 0.1) !important;
            background-color: transparent !important;
        }

        .user_img {
            height: 60px;
            width: 60px;
            border: 2px solid #78e08f;
            box-shadow: 0 0 10px #78e08f;
        }

        .user_img_msg {
            height: 40px;
            width: 40px;
            border: 1.5px solid #f5f6fa;
        }

        .user_info span {
            font-size: 20px;
            color: white;
            font-weight: bold;
        }

        .user_info p {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
        }

        .msg_cotainer {
            margin-top: auto;
            margin-bottom: auto;
            margin-left: 10px;
            border-radius: 15px;
            background-color: var(--bot-msg-bg);
            color: #ecf0f1;
            padding: 12px;
            position: relative;
            max-width: 80%;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .msg_cotainer_send {
            margin-top: auto;
            margin-bottom: auto;
            margin-right: 10px;
            border-radius: 15px;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: white;
            padding: 12px;
            position: relative;
            max-width: 80%;
        }

        .type_msg {
            background-color: rgba(255, 255, 255, 0.05) !important;
            border: 0 !important;
            color: white !important;
            height: 50px !important;
            border-radius: 15px 0 0 15px !important;
        }

        .send_btn {
            border-radius: 0 15px 15px 0 !important;
            background-color: var(--accent-color) !important;
            border: 0 !important;
            color: white !important;
            cursor: pointer;
            transition: all 0.3s;
        }

        .send_btn:hover {
            opacity: 0.8;
            transform: scale(1.05);
        }

        /* Animations */
        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.9);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse-ring {
            0% {
                transform: scale(0.9);
                box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.7);
            }

            70% {
                transform: scale(1.1);
                box-shadow: 0 0 0 15px rgba(255, 255, 255, 0);
            }

            100% {
                transform: scale(0.9);
                box-shadow: 0 0 0 0 rgba(255, 255, 255, 0);
            }
        }

        .animated-msg {
            animation: slideInUp 0.4s ease-out forwards;
        }
    </style>
</head>

<body>
    <div class="container-fluid h-100">
        <div class="row justify-content-center h-100">
            <div class="col-md-8 col-xl-4 chat">
                <div class="card">
                    <div class="card-header msg_head">
                        <div class="d-flex bd-highlight align-items-center">
                            <div class="img_cont">
                                <img src="https://img.icons8.com/fluency/96/chatbot.png"
                                    class="rounded-circle user_img">
                            </div>
                            <div class="user_info ml-3">
                                <span>Marketing Pro</span>
                                <p>Ready for growth?</p>
                            </div>
                            <div class="ml-auto">
                                <i class="fas fa-volume-mute mode-toggle" id="ttsToggleBtn" style="margin-right: 15px;"
                                    title="Text-to-Speech"></i>

                                <i class="fas fa-moon mode-toggle" id="darkModeBtn"></i>
                            </div>
                        </div>
                    </div>
                    <div id="messageFormeight" class="card-body msg_card_body"></div>
                    <div class="card-footer">
                        <form id="messageArea" class="input-group">
                            <input type="text" id="text" name="msg" placeholder="Tell me about your brand..."
                                autocomplete="off" class="form-control type_msg" required />
                            <div class="input-group-append">
                                <button type="submit" id="send" class="input-group-text send_btn"><i
                                        class="fas fa-paper-plane"></i></button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        $(document).ready(function () {
            // TTS Logic
            let isTTSActive = false;
            let synth = window.speechSynthesis;
            let voices = [];

            function populateVoices() {
                voices = synth.getVoices();
            }

            // Chrome loads voices asynchronously
            populateVoices();
            if (speechSynthesis.onvoiceschanged !== undefined) {
                speechSynthesis.onvoiceschanged = populateVoices;
            }

            function speak(text) {
                if (!isTTSActive || !text) return;

                // Stop any current speech
                synth.cancel();

                const utterance = new SpeechSynthesisUtterance(text);

                // Try to find a Google voice, otherwise use first available
                const googleVoice = voices.find(voice => voice.name.includes('Google US English'));
                if (googleVoice) {
                    utterance.voice = googleVoice;
                } else if (voices.length > 0) {
                    // Fallback to the first voice if Google US English isn't found
                    utterance.voice = voices[0];
                }

                utterance.rate = 1;
                utterance.pitch = 1;
                synth.speak(utterance);
            }

            $("#ttsToggleBtn").on("click", function () {
                isTTSActive = !isTTSActive;
                $(this).toggleClass("fa-volume-mute fa-volume-up");
                $(this).toggleClass("active");

                if (!isTTSActive) {
                    synth.cancel();
                }
            });

            // Dark Mode Toggle Logic
            $("#darkModeBtn").on("click", function () {
                $("body").toggleClass("deep-night");
                $(this).toggleClass("fa-moon fa-sun");
            });

            $("#messageArea").on("submit", function (event) {
                const date = new Date();
                const str_time = date.getHours() + ":" + date.getMinutes().toString().padStart(2, '0');
                var rawText = $("#text").val();

                var userHtml = '<div class="d-flex justify-content-end mb-4 animated-msg"><div class="msg_cotainer_send">' + rawText + '</div><div class="img_cont_msg"><img src="https://i.ibb.co/d5b84Xw/Untitled-design.png" class="rounded-circle user_img_msg"></div></div>';

                $("#text").val("");
                $("#messageFormeight").append(userHtml);

                var chatBody = document.getElementById("messageFormeight");
                chatBody.scrollTop = chatBody.scrollHeight;

                $.ajax({
                    data: { msg: rawText },
                    type: "POST",
                    url: "/get",
                }).done(function (data) {
                    var botHtml = '<div class="d-flex justify-content-start mb-4 animated-msg"><div class="img_cont_msg"><img src="https://img.icons8.com/fluency/96/chatbot.png" class="rounded-circle user_img_msg"></div><div class="msg_cotainer">' + data + '</div></div>';
                    $("#messageFormeight").append($.parseHTML(botHtml));
                    chatBody.scrollTop = chatBody.scrollHeight;

                    // Speak the response if enabled
                    speak(data);
                });
                event.preventDefault();
            });
        });

    </script>


</body>

</html>
